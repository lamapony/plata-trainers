<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Platå · vocab-SR</title>
  <meta name="description" content="Open Danish vocabulary spaced repetition — Danish ↔ Russian, lite SM-2." />
  <meta name="author" content="Dmitrii Babinov" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%E2%9B%AF%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <main class="app" id="app">
    <header class="hdr">
      <a class="brand" href="../README.md" aria-label="Platå trainers">
        <span class="brand-mark">⛰</span>
        <span class="brand-text">platå</span>
        <span class="brand-sep">·</span>
        <span class="brand-sub">vocab-SR <span class="ver">v0.2</span></span>
      </a>
      <nav class="hdr-actions">
        <button class="icon-btn" id="export-btn" title="Export progress (JSON)" aria-label="Export progress">↓</button>
        <button class="icon-btn" id="import-btn" title="Import progress (JSON)" aria-label="Import progress">↑</button>
        <button class="icon-btn" id="reset-btn" title="Reset all progress" aria-label="Reset progress">↺</button>
      </nav>
    </header>

    <section class="stats" id="stats" aria-live="polite">
      <div class="stat"><span class="stat-num" id="stat-today">0</span><span class="stat-label">i dag</span></div>
      <div class="stat"><span class="stat-num" id="stat-correct">0</span><span class="stat-label">rigtige</span></div>
      <div class="stat"><span class="stat-num" id="stat-accuracy">—</span><span class="stat-label">accuracy</span></div>
      <div class="stat"><span class="stat-num" id="stat-streak">0</span><span class="stat-label">streak</span></div>
      <div class="stat"><span class="stat-num" id="stat-mastered">0</span><span class="stat-label">mastered</span></div>
    </section>

    <section class="pickers" aria-label="Choose direction">
      <div class="picker-row">
        <span class="picker-label">Retning</span>
        <div class="chip-group" role="tablist" id="dir-group">
          <button class="chip" data-dir="da2ru" role="tab" aria-selected="true">Dansk → Русский</button>
          <button class="chip" data-dir="ru2da" role="tab" aria-selected="false">Русский → Dansk</button>
          <button class="chip" data-dir="blandet" role="tab" aria-selected="false">Blandet</button>
        </div>
      </div>
    </section>

    <section class="card" id="drill-card" aria-live="polite">
      <div class="prompt-meta">
        <span class="stat-num" id="prompt-counter">— / —</span>
        <span class="meta-pill" id="prompt-box">box 1</span>
        <span class="meta-pill" id="prompt-dir">DA → RU</span>
      </div>
      <p class="prompt" id="prompt-text">—</p>
      <p class="prompt-hint" id="prompt-context"></p>
      <form class="answer-form" id="answer-form" autocomplete="off" novalidate>
        <input
          class="answer-input"
          id="answer-input"
          type="text"
          inputmode="text"
          autocapitalize="none"
          spellcheck="false"
          placeholder="skriv dit svar…"
          aria-label="Your answer"
        />
        <button class="btn btn-primary" type="submit" id="submit-btn">Check</button>
      </form>
      <div class="feedback hidden" id="feedback" role="status"></div>
    </section>

    <section class="card hidden" id="summary-card">
      <h2 class="summary-title">Session færdig</h2>
      <p class="summary-line"><strong id="sum-correct">0</strong> rigtige ud af <strong id="sum-total">0</strong></p>
      <p class="summary-line summary-acc">Accuracy: <strong id="sum-accuracy">—</strong></p>
      <ul class="summary-mistakes" id="sum-mistakes"></ul>
      <div class="summary-actions">
        <button class="btn btn-primary" id="again-btn">I gang igen</button>
        <button class="btn btn-ghost" id="change-dir-btn">Skift retning</button>
      </div>
    </section>

    <footer class="ftr">
      <p>
        <a href="../README.md">← platå-trainers</a> ·
        <a href="https://github.com/lamapony/plata-curriculum/blob/main/m0-bojning-og-form/README.md">M0 curriculum</a> ·
        <a href="https://github.com/lamapony/plata-trainers">source</a>
      </p>
      <p class="ftr-meta">data: LocalStorage · spaced repetition: lite SM-2 · 36 ord · MIT</p>
    </footer>
  </main>

  <input type="file" id="import-file" accept="application/json" hidden />

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
