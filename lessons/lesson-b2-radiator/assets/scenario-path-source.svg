<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="A calm visual route through email, chat, formal reply, workplace talk, and outcome">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8f4"/>
      <stop offset="0.55" stop-color="#e7eeeb"/>
      <stop offset="1" stop-color="#d9e4df"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c26f4c"/>
      <stop offset="1" stop-color="#8d4c3c"/>
    </linearGradient>
    <filter id="paperTexture" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#18231f" flood-opacity="0.16"/>
    </filter>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3.5" fill="#9b5a45"/>
    </marker>
  </defs>

  <rect width="900" height="420" rx="34" fill="url(#paper)"/>
  <rect x="22" y="22" width="856" height="376" rx="26" fill="#f7faf6" opacity="0.64"/>
