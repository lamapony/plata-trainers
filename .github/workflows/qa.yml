name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  no-deps-qa:
    name: No-dependency static QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run full QA suite
        run: npm run check

      - name: Compare quality report with base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .dist
          base_dir="$(mktemp -d)"
          git archive "$BASE_SHA" | tar -x -C "$base_dir"
          node scripts/build-quality-report.js --root "$base_dir" --out .dist/quality-report-base.json
          node scripts/build-quality-report.js --out .dist/quality-report-head.json
          node scripts/diff-quality-report.js --base .dist/quality-report-base.json --head .dist/quality-report-head.json --json > .dist/quality-diff.json

      - name: Compare personalization trajectory with base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .dist
          base_dir="$(mktemp -d)"
          git archive "$BASE_SHA" | tar -x -C "$base_dir"
          node scripts/smoke-personalization-trajectory.js --root "$base_dir" --json > .dist/personalization-trajectory-base.json
          node scripts/smoke-personalization-trajectory.js --json > .dist/personalization-trajectory-head.json
          node scripts/diff-personalization-trajectory.js --base .dist/personalization-trajectory-base.json --head .dist/personalization-trajectory-head.json --json > .dist/personalization-trajectory-diff.json

      - name: Compare dashboard recommendations with base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .dist
          base_dir="$(mktemp -d)"
          git archive "$BASE_SHA" | tar -x -C "$base_dir"
          node scripts/snapshot-dashboard-recommendations.js --root "$base_dir" --json > .dist/dashboard-recommendations-base.json
          node scripts/snapshot-dashboard-recommendations.js --json > .dist/dashboard-recommendations-head.json
          node scripts/diff-dashboard-snapshot.js --base .dist/dashboard-recommendations-base.json --head .dist/dashboard-recommendations-head.json --json > .dist/dashboard-recommendations-diff.json

      - name: Compare demo learner with base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .dist
          base_dir="$(mktemp -d)"
          git archive "$BASE_SHA" | tar -x -C "$base_dir"
          node scripts/build-demo-learner-report.js --root "$base_dir" --json > .dist/demo-learner-base.json
          node scripts/build-demo-learner-report.js --json > .dist/demo-learner-head.json
          node scripts/diff-demo-learner-report.js --base .dist/demo-learner-base.json --head .dist/demo-learner-head.json --json > .dist/demo-learner-diff.json

      - name: Compare Today program with base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .dist
          base_dir="$(mktemp -d)"
          git archive "$BASE_SHA" | tar -x -C "$base_dir"
          node scripts/build-today-program-report.js --root "$base_dir" --json > .dist/today-program-base.json
          node scripts/build-today-program-report.js --json > .dist/today-program-head.json
          node scripts/diff-today-program-report.js --base .dist/today-program-base.json --head .dist/today-program-head.json --json > .dist/today-program-diff.json

      - name: Summarize review diffs
        if: github.event_name == 'pull_request'
        run: |
          node scripts/build-review-report.js \
            --quality-diff .dist/quality-diff.json \
            --dashboard-diff .dist/dashboard-recommendations-diff.json \
            --demo-diff .dist/demo-learner-diff.json \
            --today-diff .dist/today-program-diff.json \
            --trajectory-diff .dist/personalization-trajectory-diff.json \
            --out .dist/review-report.json \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            --summary-limit 8 \
            --summary-message-limit 180 \
            --fail-on-regression

      - name: Verify public pages map to files
        run: |
          test -f index.html
          test -f dashboard.html
          test -f 404.html
          test -f robots.txt
          test -f sitemap.xml
          test -f site.webmanifest
          test -f bojning-drill/index.html
          test -f ordstilling-drill/index.html
          test -f vocab-sr/index.html
          test -f lessons/lesson-01/index.html
          test -f lessons/lesson-b2-radiator/index.html
          test -f lessons/lesson-b2-job-followup/index.html
