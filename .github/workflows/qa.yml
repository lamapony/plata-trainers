name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  no-deps-qa:
    name: No-dependency static QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run full QA suite
        run: npm run check

      - name: Verify public pages map to files
        run: |
          test -f index.html
          test -f dashboard.html
          test -f 404.html
          test -f robots.txt
          test -f sitemap.xml
          test -f site.webmanifest
          test -f bojning-drill/index.html
          test -f ordstilling-drill/index.html
          test -f vocab-sr/index.html
          test -f lessons/lesson-01/index.html
          test -f lessons/lesson-b2-radiator/index.html
          test -f lessons/lesson-b2-job-followup/index.html
